name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo dependency doctor
        run: npx expo-doctor
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Web export sanity
        run: npm run export

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/analysis-worker/pyproject.toml
      - name: Install worker test dependencies
        run: python -m pip install -e './services/analysis-worker[dev]'
      - name: Compile worker package
        run: python -m compileall -q services/analysis-worker/dance_ai_worker
      - name: Run worker tests
        run: python -m pytest services/analysis-worker/tests
      - name: Run worker health command
        run: python -m dance_ai_worker.health
        working-directory: services/analysis-worker
